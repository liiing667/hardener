title: Profile override without generic fallback (Linux profile fixture)
os: linux
labels:
- ssh
checksuites:
- id: sshd-active-no-fallback
  description: debian-server matches only with --profile server; without it
    the check would vanish from the score on every Debian-family system.
  command: systemctl is-active ssh | grep -c active
  expected: 1
  sudo: false
  security_level: baseline
  distro:
    debian-server:
      command: systemctl is-active ssh | grep -c active
